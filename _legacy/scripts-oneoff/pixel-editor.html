<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MiFrens Pixel Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: monospace; display: flex; height: 100vh; }

  /* Left: Canvas */
  #canvas-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  #editor-canvas {
    image-rendering: pixelated;
    cursor: crosshair;
    border: 1px solid #444;
  }

  /* Right: Controls */
  #sidebar {
    width: 280px; padding: 12px; background: #16213e;
    overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    border-left: 1px solid #333;
  }
  h3 { color: #a78bfa; font-size: 13px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  label { font-size: 11px; display: block; margin-top: 4px; }
  input[type="range"] { width: 100%; }
  button {
    padding: 6px 10px; background: #a78bfa; color: #000; border: none;
    cursor: pointer; font-family: monospace; font-weight: bold; font-size: 12px;
  }
  button:hover { background: #c4b5fd; }
  .btn-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .btn-sm { padding: 4px 8px; font-size: 11px; }
  .btn-danger { background: #ef4444; color: #fff; }
  select { width: 100%; padding: 4px; background: #0f3460; color: #eee; border: 1px solid #444; }

  /* Palette */
  #palette { display: flex; flex-wrap: wrap; gap: 2px; }
  .swatch {
    width: 24px; height: 24px; border: 2px solid transparent; cursor: pointer;
    border-radius: 2px;
  }
  .swatch.active { border-color: #fff; box-shadow: 0 0 4px #fff; }
  .swatch:hover { border-color: #a78bfa; }

  /* Layer list */
  #layers { font-size: 11px; }
  .layer-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
  .layer-row input[type="checkbox"] { margin: 0; }
  .layer-name { flex: 1; cursor: pointer; }
  .layer-name.active-layer { color: #a78bfa; font-weight: bold; }

  /* Reference image */
  #ref-controls label { display: inline; }
  #ref-img { display: none; }

  /* Tool indicator */
  #tool-indicator { font-size: 12px; color: #a78bfa; }
  #coord-display { font-size: 11px; color: #888; }
</style>
</head>
<body>

<div id="canvas-wrap">
  <canvas id="editor-canvas"></canvas>
</div>

<div id="sidebar">
  <div>
    <h3>MiFrens Pixel Editor</h3>
    <div id="tool-indicator">Tool: Draw</div>
    <div id="coord-display">x: - y: -</div>
  </div>

  <div>
    <h3>Reference Image</h3>
    <input type="file" id="ref-img" accept="image/*">
    <button onclick="document.getElementById('ref-img').click()">Load Reference PNG</button>
    <label>Opacity: <span id="ref-opacity-val">40%</span></label>
    <input type="range" id="ref-opacity" min="0" max="100" value="40">
  </div>

  <div>
    <h3>Base Layer (existing SVG)</h3>
    <input type="file" id="base-svg" accept=".svg">
    <button onclick="document.getElementById('base-svg').click()">Load Base SVG</button>
    <div class="btn-row" style="margin-top:4px">
      <button class="btn-sm" onclick="loadExistingSVG('gnome-01')">Gnome</button>
      <button class="btn-sm" onclick="loadExistingSVG('elf-01')">Elf</button>
      <button class="btn-sm" onclick="loadExistingSVG('wizard-01')">Wizard</button>
      <button class="btn-sm" onclick="loadExistingSVG('peasant-01')">Peasant</button>
    </div>
  </div>

  <div>
    <h3>Layers</h3>
    <div id="layers"></div>
    <div class="btn-row" style="margin-top:6px">
      <button class="btn-sm" onclick="addLayer()">+ Layer</button>
      <button class="btn-sm btn-danger" onclick="deleteLayer()">- Delete</button>
    </div>
  </div>

  <div>
    <h3>Palette</h3>
    <div id="palette"></div>
    <div style="margin-top:6px">
      <input type="color" id="custom-color" value="#50823C">
      <button class="btn-sm" onclick="addCustomColor()">Add Color</button>
    </div>
  </div>

  <div>
    <h3>Tools (keyboard)</h3>
    <div style="font-size:11px; line-height:1.8">
      <b>D</b> = Draw &nbsp; <b>E</b> = Eraser &nbsp; <b>P</b> = Picker<br>
      <b>F</b> = Fill bucket &nbsp; <b>G</b> = Toggle grid<br>
      <b>Ctrl+Z</b> = Undo &nbsp; <b>Ctrl+Y</b> = Redo<br>
      <b>Scroll</b> = Zoom &nbsp; <b>Middle-drag</b> = Pan
    </div>
  </div>

  <div>
    <h3>Zoom</h3>
    <input type="range" id="zoom" min="2" max="12" value="6" step="0.5">
    <span id="zoom-val">6x</span>
  </div>

  <div>
    <h3>Export</h3>
    <select id="export-layer">
      <option value="all">All visible layers</option>
    </select>
    <div class="btn-row" style="margin-top:6px">
      <button onclick="exportSVG()">Export SVG</button>
      <button onclick="exportAllLayers()">Export All Layers</button>
    </div>
  </div>
</div>

<script>
const GRID = 120;
const canvas = document.getElementById('editor-canvas');
const ctx = canvas.getContext('2d');

// State
let zoom = 6;
let showGrid = true;
let tool = 'draw'; // draw, erase, pick, fill
let currentColor = '#508232';
let mouseDown = false;
let panX = 0, panY = 0;
let isPanning = false;
let panStartX, panStartY;

// Layers: each is { name, visible, pixels: Map<"x,y" -> color> }
let layers = [{ name: 'body', visible: true, pixels: new Map() }];
let activeLayerIdx = 0;

// Reference image
let refImage = null;
let refOpacity = 0.4;
let refCanvas = null;  // offscreen canvas for color picking from reference
let refCtx = null;

// Base SVG pixels (read-only display)
let baseSvgPixels = new Map(); // "x,y" -> color
let showBase = true;

// Undo/redo
let undoStack = [];
let redoStack = [];

// Default elf palette
const DEFAULT_PALETTE = [
  '#0F0F08', '#142D0E', '#1E3C19', '#2D501E',
  '#375F2D', '#468232', '#5A9B41', '#78C855',
  '#456E2D', '#648C41',
  '#145A82', '#1E82B4', '#3296C8', '#50B4DC',
  '#A03C0A', '#D26414',
  '#23140A', '#50371E', '#785028',
  '#D2B93C', '#E6D25A',
  '#1A1A1A', '#969696', '#D2D2D2', '#FFFFFF',
];

let palette = [...DEFAULT_PALETTE];

// ---- Init ----
function init() {
  updateCanvasSize();
  buildPalette();
  updateLayerList();
  updateExportSelect();
  render();
}

function updateCanvasSize() {
  const w = GRID * zoom;
  canvas.width = w;
  canvas.height = w;
  canvas.style.width = w + 'px';
  canvas.style.height = w + 'px';
}

// ---- Palette ----
function buildPalette() {
  const el = document.getElementById('palette');
  el.innerHTML = '';
  palette.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (c === currentColor ? ' active' : '');
    sw.style.background = c;
    sw.onclick = () => { currentColor = c; buildPalette(); };
    el.appendChild(sw);
  });
}

function addCustomColor() {
  const c = document.getElementById('custom-color').value.toUpperCase();
  if (!palette.includes(c)) palette.push(c);
  currentColor = c;
  buildPalette();
}

// ---- Layers ----
function updateLayerList() {
  const el = document.getElementById('layers');
  el.innerHTML = '';
  layers.forEach((l, i) => {
    const row = document.createElement('div');
    row.className = 'layer-row';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = l.visible;
    cb.onchange = () => { l.visible = cb.checked; render(); };
    const name = document.createElement('span');
    name.className = 'layer-name' + (i === activeLayerIdx ? ' active-layer' : '');
    name.textContent = l.name;
    name.onclick = () => { activeLayerIdx = i; updateLayerList(); render(); };
    name.ondblclick = () => {
      const n = prompt('Layer name:', l.name);
      if (n) { l.name = n; updateLayerList(); updateExportSelect(); }
    };
    row.appendChild(cb);
    row.appendChild(name);
    el.appendChild(row);
  });
}

function addLayer() {
  const name = prompt('Layer name:', `layer-${layers.length + 1}`);
  if (!name) return;
  layers.push({ name, visible: true, pixels: new Map() });
  activeLayerIdx = layers.length - 1;
  updateLayerList();
  updateExportSelect();
  render();
}

function deleteLayer() {
  if (layers.length <= 1) return;
  layers.splice(activeLayerIdx, 1);
  activeLayerIdx = Math.min(activeLayerIdx, layers.length - 1);
  updateLayerList();
  updateExportSelect();
  render();
}

function updateExportSelect() {
  const sel = document.getElementById('export-layer');
  sel.innerHTML = '<option value="all">All visible layers</option>';
  layers.forEach((l, i) => {
    sel.innerHTML += `<option value="${i}">${l.name}</option>`;
  });
}

// ---- Rendering ----
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, GRID * zoom, GRID * zoom);

  // Reference image
  if (refImage) {
    ctx.globalAlpha = refOpacity;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(refImage, 0, 0, GRID * zoom, GRID * zoom);
    ctx.globalAlpha = 1;
  }

  // Base SVG (read-only, faded)
  if (showBase && baseSvgPixels.size > 0) {
    ctx.globalAlpha = 0.3;
    baseSvgPixels.forEach((color, key) => {
      const [x, y] = key.split(',').map(Number);
      ctx.fillStyle = color;
      ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
    });
    ctx.globalAlpha = 1;
  }

  // Draw layers bottom-up
  for (let i = 0; i < layers.length; i++) {
    const l = layers[i];
    if (!l.visible) continue;
    l.pixels.forEach((color, key) => {
      const [x, y] = key.split(',').map(Number);
      ctx.fillStyle = color;
      ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
    });
  }

  // Grid
  if (showGrid && zoom >= 4) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * zoom, 0);
      ctx.lineTo(i * zoom, GRID * zoom);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * zoom);
      ctx.lineTo(GRID * zoom, i * zoom);
      ctx.stroke();
    }
  }
}

// ---- Drawing ----
function getPixelCoord(e) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / zoom);
  const y = Math.floor((e.clientY - rect.top) / zoom);
  return [Math.max(0, Math.min(GRID - 1, x)), Math.max(0, Math.min(GRID - 1, y))];
}

function saveUndo() {
  // Deep copy active layer pixels
  const copy = new Map(layers[activeLayerIdx].pixels);
  undoStack.push({ layer: activeLayerIdx, pixels: copy });
  if (undoStack.length > 200) undoStack.shift();
  redoStack = [];
}

function undo() {
  if (undoStack.length === 0) return;
  const state = undoStack.pop();
  redoStack.push({ layer: state.layer, pixels: new Map(layers[state.layer].pixels) });
  layers[state.layer].pixels = state.pixels;
  render();
}

function redo() {
  if (redoStack.length === 0) return;
  const state = redoStack.pop();
  undoStack.push({ layer: state.layer, pixels: new Map(layers[state.layer].pixels) });
  layers[state.layer].pixels = state.pixels;
  render();
}

function applyTool(x, y) {
  const key = `${x},${y}`;
  const layer = layers[activeLayerIdx];

  if (tool === 'draw') {
    layer.pixels.set(key, currentColor);
  } else if (tool === 'erase') {
    layer.pixels.delete(key);
  } else if (tool === 'pick') {
    // Check drawn layers top-down first
    for (let i = layers.length - 1; i >= 0; i--) {
      const c = layers[i].pixels.get(key);
      if (c) { currentColor = c; buildPalette(); return; }
    }
    // Then check base SVG
    const baseColor = baseSvgPixels.get(key);
    if (baseColor) { currentColor = baseColor; buildPalette(); return; }
    // Then sample from reference image
    if (refCtx) {
      const px = refCtx.getImageData(x, y, 1, 1).data;
      if (px[3] > 30) { // not transparent
        const hex = '#' + ((1 << 24) + (px[0] << 16) + (px[1] << 8) + px[2]).toString(16).slice(1).toUpperCase();
        currentColor = hex;
        if (!palette.includes(hex)) { palette.push(hex); }
        buildPalette();
        return;
      }
    }
  } else if (tool === 'fill') {
    floodFill(layer, x, y, currentColor);
  }
  render();
}

function floodFill(layer, startX, startY, fillColor) {
  const targetColor = layer.pixels.get(`${startX},${startY}`) || null;
  if (targetColor === fillColor) return;

  const stack = [[startX, startY]];
  const visited = new Set();

  while (stack.length > 0) {
    const [x, y] = stack.pop();
    const key = `${x},${y}`;
    if (visited.has(key)) continue;
    if (x < 0 || x >= GRID || y < 0 || y >= GRID) continue;

    const existing = layer.pixels.get(key) || null;
    if (existing !== targetColor) continue;

    visited.add(key);
    layer.pixels.set(key, fillColor);
    stack.push([x+1,y], [x-1,y], [x,y+1], [x,y-1]);
  }
}

// ---- Events ----
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 1) { // middle click = pan
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    return;
  }
  if (e.button !== 0) return;
  mouseDown = true;
  saveUndo();
  const [x, y] = getPixelCoord(e);
  applyTool(x, y);
});

canvas.addEventListener('mousemove', (e) => {
  const [x, y] = getPixelCoord(e);
  document.getElementById('coord-display').textContent = `x: ${x}  y: ${y}`;
  if (mouseDown && (tool === 'draw' || tool === 'erase')) {
    applyTool(x, y);
  }
});

canvas.addEventListener('mouseup', () => { mouseDown = false; isPanning = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.5 : 0.5;
  zoom = Math.max(2, Math.min(12, zoom + delta));
  document.getElementById('zoom').value = zoom;
  document.getElementById('zoom-val').textContent = zoom + 'x';
  updateCanvasSize();
  render();
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('keydown', (e) => {
  if (e.key === 'd') { tool = 'draw'; }
  else if (e.key === 'e') { tool = 'erase'; }
  else if (e.key === 'p') { tool = 'pick'; }
  else if (e.key === 'f') { tool = 'fill'; }
  else if (e.key === 'g') { showGrid = !showGrid; render(); }
  else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  else if (e.key === 'y' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); redo(); }
  document.getElementById('tool-indicator').textContent = `Tool: ${tool.charAt(0).toUpperCase() + tool.slice(1)}`;
});

// Zoom slider
document.getElementById('zoom').oninput = function() {
  zoom = parseFloat(this.value);
  document.getElementById('zoom-val').textContent = zoom + 'x';
  updateCanvasSize();
  render();
};

// Ref opacity
document.getElementById('ref-opacity').oninput = function() {
  refOpacity = this.value / 100;
  document.getElementById('ref-opacity-val').textContent = this.value + '%';
  render();
};

// Load reference image
document.getElementById('ref-img').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    refImage = img;
    // Rasterize to a 120x120 offscreen canvas for pixel-accurate color picking
    refCanvas = document.createElement('canvas');
    refCanvas.width = GRID;
    refCanvas.height = GRID;
    refCtx = refCanvas.getContext('2d');
    refCtx.imageSmoothingEnabled = false;
    refCtx.drawImage(img, 0, 0, GRID, GRID);
    render();
  };
  img.src = URL.createObjectURL(file);
};

// Load base SVG
document.getElementById('base-svg').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => { parseSvgRects(ev.target.result); };
  reader.readAsText(file);
};

function loadExistingSVG(name) {
  // Load from frens directory
  fetch(`../public/frens/${name}.svg`)
    .then(r => r.text())
    .then(text => parseSvgRects(text))
    .catch(() => alert('Could not load SVG. Make sure you\'re running from the project root.'));
}

function parseSvgRects(svgText) {
  baseSvgPixels.clear();
  const regex = /x="(\d+)" y="(\d+)" width="1" height="1" fill="(#[0-9A-Fa-f]{6})"/g;
  let match;
  while ((match = regex.exec(svgText)) !== null) {
    baseSvgPixels.set(`${match[1]},${match[2]}`, match[3]);
  }
  render();
}

// ---- Export ----
function exportSVG() {
  const sel = document.getElementById('export-layer').value;
  let pixels = new Map();

  if (sel === 'all') {
    // Merge all visible layers bottom-up
    for (const l of layers) {
      if (!l.visible) continue;
      l.pixels.forEach((c, k) => pixels.set(k, c));
    }
  } else {
    pixels = layers[parseInt(sel)].pixels;
  }

  const rects = [];
  pixels.forEach((color, key) => {
    const [x, y] = key.split(',').map(Number);
    rects.push({ x, y, color });
  });
  rects.sort((a, b) => a.y - b.y || a.x - b.x);

  let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" shape-rendering="crispEdges">\n';
  for (const r of rects) {
    svg += `<rect x="${r.x}" y="${r.y}" width="1" height="1" fill="${r.color}"/>\n`;
  }
  svg += '</svg>\n';

  downloadFile(svg, `${sel === 'all' ? 'merged' : layers[parseInt(sel)].name}.svg`, 'image/svg+xml');
}

function exportAllLayers() {
  layers.forEach((l, i) => {
    if (l.pixels.size === 0) return;
    const rects = [];
    l.pixels.forEach((color, key) => {
      const [x, y] = key.split(',').map(Number);
      rects.push({ x, y, color });
    });
    rects.sort((a, b) => a.y - b.y || a.x - b.x);

    let svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" shape-rendering="crispEdges">\n';
    for (const r of rects) {
      svg += `<rect x="${r.x}" y="${r.y}" width="1" height="1" fill="${r.color}"/>\n`;
    }
    svg += '</svg>\n';
    downloadFile(svg, `${l.name}.svg`, 'image/svg+xml');
  });
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// Init
init();
</script>
</body>
</html>
