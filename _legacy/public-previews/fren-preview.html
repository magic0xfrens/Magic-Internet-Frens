<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frens Preview — FrenForge Backgrounds</title>
<style>
  body { background: #0d0a1a; color: #ccc; font-family: 'Menlo', monospace; padding: 32px; }
  h1 { text-align: center; color: #a78bfa; margin-bottom: 8px; font-size: 20px; }
  h2 { text-align: center; color: #666; margin-bottom: 32px; font-size: 12px; font-weight: normal; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 40px; }
  .fren-card {
    background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px;
    padding: 12px; text-align: center; width: 160px;
  }
  .fren-card canvas { image-rendering: pixelated; width: 144px; height: 144px; border-radius: 8px; display: block; margin: 0 auto; }
  .fren-card .label { margin-top: 8px; font-size: 12px; font-weight: bold; }
  .fren-card .sub { font-size: 10px; color: #666; margin-top: 2px; }
  .fren-card .hash-label { font-size: 9px; color: #888; margin-top: 2px; font-family: monospace; }
  .class-wizard .label { color: #a78bfa; }
  .class-king .label { color: #FFD700; }
  .class-knight .label { color: #75c9ee; }
  .class-gnome .label { color: #E94848; }
  .class-elf .label { color: #4ade80; }
  .class-apprentice .label { color: #F7931A; }
  .class-peasant .label { color: #9ca3af; }
  .section { text-align: center; color: #555; font-size: 11px; text-transform: uppercase; letter-spacing: 2px; margin: 24px 0 16px; }
</style>
</head>
<body>
<h1>MiFrens — FrenForge On-Chain Preview</h1>
<h2>Gradient backgrounds from trait-hash (unique per trait combination)</h2>

<div class="section">All 7 Classes — Default Traits</div>
<div class="grid" id="grid0"></div>

<div class="section">Trait-Hash Gradient Variations — Same Class, Different Traits</div>
<div class="grid" id="gridVariations"></div>

<div class="section">BTC Variants</div>
<div class="grid" id="gridBtc"></div>

<script>
// ── FrenForge gradient colors (exact values from contract) ──
const GRADIENT_TOP = [
  [0x50,0x38,0x78],[0x78,0x58,0x28],[0x28,0x50,0x78],
  [0x78,0x55,0x30],[0x48,0x48,0x42],[0x78,0x30,0x30],[0x28,0x78,0x28],
];
const GRADIENT_BOTTOM = [
  [0x10,0x0a,0x1e],[0x1e,0x14,0x06],[0x06,0x10,0x1e],
  [0x1e,0x14,0x08],[0x12,0x12,0x10],[0x1e,0x08,0x08],[0x06,0x1e,0x06],
];
const CLASS_IDX = {Wizard:0,King:1,Knight:2,Apprentice:3,Peasant:4,Gnome:5,Elf:6};
const SIZE = 120;

function clamp(v){ return Math.max(0,Math.min(255,Math.round(v))); }

// Deterministic 16-bit hash from trait indices (matches FrenForge contract)
function getTraitHash(bodyIdx, faceIdx, itemIdx){
  const seed = bodyIdx * 7919 + faceIdx * 6271 + itemIdx * 4813;
  return seed & 0xFFFF;
}

// Apply trait-hash-based per-channel shifts (matches FrenForge._applyTraitShift)
function applyTraitShift(r, g, b, hash){
  const rShift = ((hash >> 0) & 0xF) - 8;
  const gShift = ((hash >> 4) & 0xF) - 8;
  const bShift = ((hash >> 8) & 0xF) - 8;
  return [clamp(r + rShift), clamp(g + gShift), clamp(b + bShift)];
}

function getGradientColors(classIdx, bodyIdx, faceIdx, itemIdx){
  const hash = getTraitHash(bodyIdx, faceIdx, itemIdx);
  const t = applyTraitShift(...GRADIENT_TOP[classIdx], hash);
  const b = applyTraitShift(...GRADIENT_BOTTOM[classIdx], hash);
  return { top: t, bottom: b, hash };
}

/** Fetch SVG text, parse all <rect> into a pixel map {x,y} → [r,g,b] */
async function parseSvgPixels(url){
  const resp = await fetch(url);
  if(!resp.ok) return {};
  const text = await resp.text();
  const pixels = {};
  const re = /<rect x="(\d+)" y="(\d+)" width="1" height="1" fill="(#[0-9A-Fa-f]{6})"/g;
  let m;
  while((m = re.exec(text)) !== null){
    const x = parseInt(m[1]), y = parseInt(m[2]);
    const hex = m[3];
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    pixels[y * SIZE + x] = [r,g,b];
  }
  return pixels;
}

/** Composite layer onto canvas (non-null pixels overwrite) — painter's algorithm */
function compositeLayer(canvas, layer){
  for(const key in layer){
    canvas[key] = layer[key];
  }
}

async function renderFren(container, fren, bodyIdx, faceIdx, itemIdx){
  const classIdx = CLASS_IDX[fren.cls];
  const grad = getGradientColors(classIdx, bodyIdx, faceIdx, itemIdx);

  // Parse all three SVG layers
  const [facePixels, bodyPixels, itemPixels] = await Promise.all([
    parseSvgPixels('/frens/' + fren.face),
    parseSvgPixels('/frens/' + fren.body),
    parseSvgPixels('/frens/' + fren.item),
  ]);

  // Composite: face → body → item (same as FrenForge contract)
  const composite = {};
  compositeLayer(composite, facePixels);
  compositeLayer(composite, bodyPixels);
  compositeLayer(composite, itemPixels);

  // Create canvas and draw
  const canvas = document.createElement('canvas');
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  // Draw gradient background first (exactly like FrenForge)
  for(let y = 0; y < SIZE; y++){
    const t = y / (SIZE - 1);
    const r = Math.round(grad.top[0] + (grad.bottom[0] - grad.top[0]) * t);
    const g = Math.round(grad.top[1] + (grad.bottom[1] - grad.top[1]) * t);
    const b = Math.round(grad.top[2] + (grad.bottom[2] - grad.top[2]) * t);
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fillRect(0, y, SIZE, 1);
  }

  // Draw composited pixels on top (transparent pixels show gradient)
  for(const key in composite){
    const idx = parseInt(key);
    const x = idx % SIZE;
    const y = Math.floor(idx / SIZE);
    const [r,g,b] = composite[key];
    ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
    ctx.fillRect(x, y, 1, 1);
  }

  // Build card
  const card = document.createElement('div');
  card.className = 'fren-card class-' + fren.cls.toLowerCase();
  card.appendChild(canvas);

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = fren.label || fren.cls;
  card.appendChild(label);

  const sub = document.createElement('div');
  sub.className = 'sub';
  sub.textContent = fren.body.replace('.svg','');
  card.appendChild(sub);

  const hashLabel = document.createElement('div');
  hashLabel.className = 'hash-label';
  hashLabel.textContent = 'hash: 0x' + grad.hash.toString(16).padStart(4, '0');
  card.appendChild(hashLabel);

  container.appendChild(card);
}

async function render(){
  const grid0 = document.getElementById('grid0');
  const allClasses = [
    {cls:'Wizard',     body:'wizard-01.svg',           face:'face-03.svg',       item:'wiz-item-01.svg'},
    {cls:'King',       body:'king-cloth-orange.svg',    face:'face-01.svg',       item:'king-item-red.svg'},
    {cls:'Knight',     body:'knight-silver.svg',        face:'face-07.svg',       item:'knight-item-silver.svg'},
    {cls:'Apprentice', body:'apprentice-01.svg',        face:'face-02.svg',       item:'apprentice-item-01.svg'},
    {cls:'Peasant',    body:'peasant-01.svg',           face:'face-04.svg',       item:'peasant-item-01.svg'},
    {cls:'Gnome',      body:'gnome-01.svg',             face:'gnome-face-03.svg', item:'gnome-item-01.svg'},
    {cls:'Elf',        body:'elf-03.svg',               face:'elf-face-02.svg',   item:'elf-item-00.svg'},
  ];
  // Each with different body/face/item indices for unique gradients
  for(let i = 0; i < allClasses.length; i++){
    await renderFren(grid0, allClasses[i], i, i+1, i+2);
  }

  // Show same class with different trait combos to demonstrate gradient variation
  const gridVar = document.getElementById('gridVariations');
  const wizVariants = [
    {cls:'Wizard', body:'wizard-01.svg', face:'face-01.svg', item:'wiz-item-01.svg', label:'Wizard (0,0,0)'},
    {cls:'Wizard', body:'wizard-02.svg', face:'face-03.svg', item:'wiz-item-02.svg', label:'Wizard (1,2,1)'},
    {cls:'Wizard', body:'wizard-03.svg', face:'face-05.svg', item:'wiz-item-03.svg', label:'Wizard (2,4,2)'},
    {cls:'Wizard', body:'wizard-04.svg', face:'face-07.svg', item:'wiz-item-04.svg', label:'Wizard (3,6,3)'},
    {cls:'Wizard', body:'wizard-05.svg', face:'face-09.svg', item:'wiz-item-01.svg', label:'Wizard (4,8,0)'},
    {cls:'Wizard', body:'wizard-06.svg', face:'face-11.svg', item:'wiz-item-02.svg', label:'Wizard (5,10,1)'},
  ];
  const indices = [[0,0,0],[1,2,1],[2,4,2],[3,6,3],[4,8,0],[5,10,1]];
  for(let i = 0; i < wizVariants.length; i++){
    await renderFren(gridVar, wizVariants[i], indices[i][0], indices[i][1], indices[i][2]);
  }

  const gridBtc = document.getElementById('gridBtc');
  await renderFren(gridBtc, {
    cls:'Wizard', body:'wizard-btc-01.svg', face:'face-01.svg', item:'wiz-item-02.svg', label:'Wizard BTC'
  }, 0, 0, 1);
  await renderFren(gridBtc, {
    cls:'Apprentice', body:'apprentice-02-orange.svg', face:'face-09.svg', item:'apprentice-item-01.svg', label:'Apprentice Orange'
  }, 1, 8, 0);
}

render();
</script>
</body>
</html>
