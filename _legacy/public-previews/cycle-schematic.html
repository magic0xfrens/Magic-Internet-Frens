<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eternal Cycle Schematic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0B0A12;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }

  .schematic {
    position: relative;
    width: 900px;
    height: 1100px;
  }

  /* ── Genesis flow (top) ── */
  .genesis {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
  }

  .genesis-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 28px;
    border-radius: 16px;
    border: 2px solid rgba(247,147,26,0.4);
    background: rgba(247,147,26,0.08);
    backdrop-filter: blur(6px);
  }
  .genesis-node--summon {
    border-color: rgba(124,92,252,0.5);
    background: rgba(124,92,252,0.1);
  }
  .genesis-icon { font-size: 28px; }
  .genesis-title {
    font-family: 'Cinzel', serif;
    font-size: 15px;
    font-weight: 800;
    color: #F7931A;
    letter-spacing: 2px;
  }
  .genesis-node--summon .genesis-title { color: #A78BFA; }
  .genesis-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }

  .vline {
    width: 2px;
    height: 28px;
    background: linear-gradient(to bottom, rgba(247,147,26,0.5), rgba(247,147,26,0.15));
  }
  .vline--glow {
    height: 32px;
    background: linear-gradient(to bottom, rgba(124,92,252,0.6), rgba(247,147,26,0.4));
    box-shadow: 0 0 10px rgba(124,92,252,0.4);
  }

  .enter-label {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #F7931A;
    text-shadow: 0 0 20px rgba(247,147,26,0.5);
    padding: 4px 0;
  }

  /* ── Pentagon ── */
  .pentagon {
    position: absolute;
    width: 750px;
    height: 600px;
    top: 320px;
    left: 50%;
    transform: translateX(-50%);
  }

  .pentagon-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  /* ── Nodes ── */
  .node {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 10;
    transform: translate(-50%, -50%);
  }

  .node-sticker {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(247,147,26,0.5);
    box-shadow: 0 0 25px rgba(247,147,26,0.2), inset 0 0 20px rgba(0,0,0,0.3);
    background: #1a1a2e;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .node-sticker:hover {
    transform: scale(1.08);
    box-shadow: 0 0 40px rgba(247,147,26,0.4), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .node-sticker img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .node--red .node-sticker {
    border-color: rgba(239,68,68,0.6);
    box-shadow: 0 0 25px rgba(239,68,68,0.2), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .node--orange .node-sticker {
    border-color: rgba(251,191,36,0.6);
    box-shadow: 0 0 25px rgba(251,191,36,0.2), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .node--purple .node-sticker {
    border-color: rgba(124,92,252,0.5);
    box-shadow: 0 0 25px rgba(124,92,252,0.2), inset 0 0 20px rgba(0,0,0,0.3);
  }
  .node--gold .node-sticker {
    border-color: rgba(247,147,26,0.7);
    box-shadow: 0 0 30px rgba(247,147,26,0.3), inset 0 0 20px rgba(0,0,0,0.3);
  }

  .node-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(4px);
  }
  .node-icon { font-size: 22px; }
  .node-title {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 800;
    color: #F7931A;
    letter-spacing: 2px;
  }
  .node--red .node-title { color: #EF4444; }
  .node--orange .node-title { color: #FBBF24; }
  .node--purple .node-title { color: #A78BFA; }
  .node--gold .node-title { color: #F7931A; }

  .node-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
  }

  /* Node positions (pentagon: top-center, top-right, bottom-right, bottom-left, top-left) */
  .node--0 { left: 50%;  top: 5%; }
  .node--1 { left: 92%;  top: 38%; }
  .node--2 { left: 78%;  top: 82%; }
  .node--3 { left: 22%;  top: 82%; }
  .node--4 { left: 8%;   top: 38%; }

  /* ── Center ── */
  .center {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }
  .center-infinity {
    font-size: 48px;
    color: #F7931A;
    line-height: 1;
    text-shadow: 0 0 30px rgba(247,147,26,0.4);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  .center-label {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 4px;
    color: rgba(255,255,255,0.6);
    text-align: center;
    line-height: 1.3;
  }

  /* ── Animated arrow on path ── */
  @keyframes pulse-glow {
    0%, 100% { opacity: 0.7; text-shadow: 0 0 20px rgba(247,147,26,0.3); }
    50% { opacity: 1; text-shadow: 0 0 40px rgba(247,147,26,0.6); }
  }

  /* ── Background particles ── */
  .bg-stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bg-star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(247,147,26,0.3);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.8; }
  }

  /* ── Title watermark ── */
  .watermark {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(255,255,255,0.15);
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- Background sparkles -->
<div class="bg-stars" id="stars"></div>

<div class="schematic">

  <!-- Genesis flow -->
  <div class="genesis">
    <div class="genesis-node">
      <span class="genesis-icon">&#x2728;</span>
      <span class="genesis-title">MINT 777</span>
      <span class="genesis-desc">All frens are minted</span>
    </div>
    <div class="vline"></div>
    <div class="genesis-node genesis-node--summon">
      <span class="genesis-icon">&#x1F52E;</span>
      <span class="genesis-title">TOKEN SUMMONED</span>
      <span class="genesis-desc">Liquidity seeded</span>
    </div>
    <div class="vline vline--glow"></div>
    <span class="enter-label">ENTERS THE CYCLE</span>
    <div class="vline" style="height:20px"></div>
  </div>

  <!-- Pentagon -->
  <div class="pentagon">
    <!-- SVG lines -->
    <svg class="pentagon-svg" viewBox="0 0 750 600" fill="none">
      <!-- Pentagon path -->
      <path d="M375 35 L690 230 L570 530 L180 530 L60 230 Z"
        stroke="rgba(247,147,26,0.2)" stroke-width="2" stroke-dasharray="10 5" fill="none" />
      <!-- Animated orb -->
      <circle r="6" fill="#F7931A" opacity="0.7">
        <animateMotion dur="10s" repeatCount="indefinite"
          path="M375 35 L690 230 L570 530 L180 530 L60 230 Z" />
      </circle>
      <!-- Glow trail -->
      <circle r="12" fill="none" stroke="#F7931A" stroke-width="1" opacity="0.3">
        <animateMotion dur="10s" repeatCount="indefinite"
          path="M375 35 L690 230 L570 530 L180 530 L60 230 Z" />
      </circle>
    </svg>

    <!-- Node 1: TRADE (top center) — Wizard at computer -->
    <div class="node node--0">
      <div class="node-sticker">
        <img src="stickers/trade.png" alt="Trade" />
      </div>
      <div class="node-badge">
        <span class="node-icon">&#x1F4B1;</span>
        <span class="node-title">TRADE</span>
        <span class="node-desc">Buy &amp; sell</span>
      </div>
    </div>

    <!-- Node 2: DEATH (top right) — Angry wizard with rope -->
    <div class="node node--1 node--red">
      <div class="node-sticker">
        <img src="stickers/death.png" alt="Death" />
      </div>
      <div class="node-badge">
        <span class="node-icon">&#x1F480;</span>
        <span class="node-title">DEATH</span>
        <span class="node-desc">Volume dies</span>
      </div>
    </div>

    <!-- Node 3: CLAIM (bottom right) — Wizard with coffee (tired, waiting) -->
    <div class="node node--2 node--orange">
      <div class="node-sticker">
        <img src="stickers/claim.png" alt="Claim" />
      </div>
      <div class="node-badge">
        <span class="node-icon">&#x1F4B0;</span>
        <span class="node-title">CLAIM</span>
        <span class="node-desc">Get your share</span>
      </div>
    </div>

    <!-- Node 4: VOTE (bottom left) — Thinking wizard with ? -->
    <div class="node node--3 node--purple">
      <div class="node-sticker">
        <img src="stickers/vote.png" alt="Vote" />
      </div>
      <div class="node-badge">
        <span class="node-icon">&#x1F5F3;&#xFE0F;</span>
        <span class="node-title">VOTE</span>
        <span class="node-desc">Choose next token</span>
      </div>
    </div>

    <!-- Node 5: RELAUNCH (top left) — HOPIUM wizard -->
    <div class="node node--4 node--gold">
      <div class="node-sticker">
        <img src="stickers/relaunch.png" alt="Relaunch" />
      </div>
      <div class="node-badge">
        <span class="node-icon">&#x1F680;</span>
        <span class="node-title">RELAUNCH</span>
        <span class="node-desc">New cycle begins</span>
      </div>
    </div>

    <!-- Center -->
    <div class="center">
      <span class="center-infinity">&#x221E;</span>
      <span class="center-label">ETERNAL<br/>CYCLE</span>
    </div>
  </div>

  <span class="watermark">MiFrens &mdash; The Eternal Cycle</span>
</div>

<script>
  // Generate background stars
  const container = document.getElementById('stars');
  for (let i = 0; i < 60; i++) {
    const star = document.createElement('div');
    star.className = 'bg-star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = (Math.random() * 3) + 's';
    star.style.width = star.style.height = (2 + Math.random() * 3) + 'px';
    container.appendChild(star);
  }
</script>
</body>
</html>
