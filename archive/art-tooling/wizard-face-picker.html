<!DOCTYPE html>
<html>
<head>
    <title>Wizard Face Picker</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: monospace;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .preview {
            background: #111;
            border: 2px solid #333;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .preview:hover {
            border-color: #ff6b00;
        }
        .svg-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }
        .svg-container svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        h2 {
            color: #ff6b00;
        }
        .label {
            margin-top: 10px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>🧙 Wizard + Face Combinations</h1>
    <p>Find your purple wizard with derp face!</p>

    <h2>Wizards Only (01-06)</h2>
    <div class="grid" id="wizards"></div>

    <h2>Faces Only (01-11)</h2>
    <div class="grid" id="faces"></div>

    <h2>All Combinations (Wizard + Face)</h2>
    <div class="grid" id="combos"></div>

    <script>
        const wizardsDiv = document.getElementById('wizards');
        const facesDiv = document.getElementById('faces');
        const combosDiv = document.getElementById('combos');

        // Show wizards
        for (let i = 1; i <= 6; i++) {
            const num = i.toString().padStart(2, '0');
            const div = document.createElement('div');
            div.className = 'preview';
            div.innerHTML = `
                <div class="svg-container">
                    <object data="public/frens/wizard-${num}.svg" type="image/svg+xml"></object>
                </div>
                <div class="label">wizard-${num}.svg</div>
            `;
            wizardsDiv.appendChild(div);
        }

        // Show faces
        for (let i = 1; i <= 11; i++) {
            const num = i.toString().padStart(2, '0');
            const div = document.createElement('div');
            div.className = 'preview';
            div.innerHTML = `
                <div class="svg-container">
                    <object data="public/frens/face-${num}.svg" type="image/svg+xml"></object>
                </div>
                <div class="label">face-${num}.svg</div>
            `;
            facesDiv.appendChild(div);
        }

        // Show combinations (wizard 1-6 with face 6, 7, 8 - likely derp faces)
        const derpFaces = [6, 7, 8];
        for (let w = 1; w <= 6; w++) {
            for (let f of derpFaces) {
                const wNum = w.toString().padStart(2, '0');
                const fNum = f.toString().padStart(2, '0');
                const div = document.createElement('div');
                div.className = 'preview';
                div.innerHTML = `
                    <div class="svg-container">
                        <object data="public/frens/wizard-${wNum}.svg" type="image/svg+xml"></object>
                        <object data="public/frens/face-${fNum}.svg" type="image/svg+xml"></object>
                    </div>
                    <div class="label">wizard-${wNum} + face-${fNum}</div>
                `;
                combosDiv.appendChild(div);
            }
        }
    </script>
</body>
</html>
