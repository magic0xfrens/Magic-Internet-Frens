<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #111; color: #fff; font-family: monospace; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; }
  .card { text-align: center; }
  .card h3 { margin: 8px 0; }
  .composite { position: relative; width: 480px; height: 480px; }
  .composite img { position: absolute; top: 0; left: 0; width: 480px; height: 480px; image-rendering: pixelated; }
  .single img { width: 480px; height: 480px; image-rendering: pixelated; }
  h2 { width: 100%; border-bottom: 1px solid #333; padding-bottom: 8px; }
</style>
</head>
<body>
  <h2>Gnome (original) vs Elf (generated)</h2>

  <div class="card">
    <h3>Gnome Body</h3>
    <div class="single"><img src="gnome-01.svg"></div>
  </div>

  <div class="card">
    <h3>Elf Body</h3>
    <div class="single"><img src="elf-01.svg"></div>
  </div>

  <div class="card">
    <h3>Gnome Composite (body + face)</h3>
    <div class="composite">
      <img src="gnome-01.svg">
      <img src="gnome-face-01.svg">
    </div>
  </div>

  <div class="card">
    <h3>Elf Composite (body + face)</h3>
    <div class="composite">
      <img src="elf-01.svg">
      <img src="elf-face-01.svg">
    </div>
  </div>

  <div class="card">
    <h3>Face 1</h3>
