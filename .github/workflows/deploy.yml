# One push updates everything.
#
# indexer/deployments/round.json is the single source of truth for the live
# deployment. The frontend imports it, the Ponder indexer imports it, and this
# workflow makes a change to it reach BOTH without anyone redeploying by hand.
#
# The problem this exists to solve: Railway was a CLI upload with no GitHub link,
# so pushes never reached it. The manifest would say one thing and the deployed
# indexer another — which is exactly how a sold-out 1111/1111 presale rendered as
# "0 / 1111" for two deployments, with nothing failing anywhere.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # The contracts hold the value, and until now nothing in CI compiled them.
  #
  # Two things made that worse than it sounds. The fork-gated suites used to
  # `return` early without FORK_RPC, so they PASSED vacuously rather than
  # skipping — 154 of them, including both system-invariant suites and the whole
  # perp engine. And the invariant that catches a mis-denominated relaunch
  # reserve is one of those. So the suite could be green while asserting almost
  # nothing about the paths that move money.
  #
  # `vm.skip` now makes the gap visible in the run output, and this job makes it
  # visible in CI. Without FORK_RPC the skipped count IS the signal: if it grows,
  # coverage moved behind the gate.
  #
  # Red from 2026-09-06 to 2026-09-24 for two reasons, one hidden behind the other:
  #
  #  1. The compiler was never pinned. Pragmas are ^0.8.26 and forge takes the
  #     newest INSTALLED match, so the deploy machine builds with 0.8.30 (r47's
  #     CBOR says so) while a fresh runner downloaded the newest release, 0.8.37.
  #     CI measured bytecode that never ships: at 31b7535 CauldronRegistry was 7 B
  #     over EIP-170 under 0.8.37 and comfortably under as actually deployed.
  #  2. Nor was forge. `stable` became 1.8.x, whose post-build LINT reports
  #     high/medium/low by default: once the re-audit shrank the registry and
  #     the size check passed, that pass ran over ~1,700 files after a
  #     SUCCESSFUL compile and took the runner down ("received a shutdown
  #     signal", shown as "canceled"). 1.8 also meters gas differently from the
  #     1.4.4 the team builds and tests with, and three gas-calibrated
  #     regressions (GACHA1f, S04 lead cache, Z03 scan) fail under it only.
  #
  # So: pin forge to v1.4.4, seed exactly the solc versions the deploy resolves
  # to, build --offline (forge cannot fetch a newer one), and assert compiler
  # parity. Upgrade forge here and on the deploy machine together, never apart.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: contracts/solidity
    env:
      FOUNDRY_PROFILE: cauldron
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
      # Set this repo secret to also run the ~154 fork-gated tests. Without it
      # they report as SKIPPED, never as passing.
      FORK_RPC: ${{ secrets.FORK_RPC }}
      POOL_MANAGER: ${{ vars.POOL_MANAGER }}
      POSITION_MANAGER: ${{ vars.POSITION_MANAGER }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.4.4 }
      # The tree resolves to three compilers: 0.8.17 (permit2's pin), 0.8.26
      # (v4-core's pin) and 0.8.30 for everything ^0.8.26. Installing exactly
      # these and building --offline reproduces the deploy machine's choice.
      - name: Seed the deploy's solc versions
        working-directory: ${{ runner.temp }}
        env: { FOUNDRY_PROFILE: default }
        run: |
          mkdir -p solc-seed/src && cd solc-seed
          printf 'pragma solidity >=0.8.0;\ncontract Seed {}\n' > src/Seed.sol
          for v in 0.8.17 0.8.26 0.8.30; do forge build --use "$v" --force > /dev/null; done
      - name: Build
        run: forge build --sizes --offline
      - name: Compiler parity with the deploy
        run: |
          v=$(jq -r .metadata.compiler.version out/CauldronRegistry.sol/CauldronRegistry.json)
          echo "CauldronRegistry built with solc $v"
          case "$v" in 0.8.30+*) ;; *) echo "::error::expected solc 0.8.30 (what the deploy uses), got $v"; exit 1 ;; esac
      - name: Test
        run: forge test -vv --offline

  # Nothing deploys unless the manifest is coherent. This is the same guard that
  # runs on prebuild, hoisted so a bad manifest fails BEFORE anything ships
  # rather than after one service has already moved.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Verify the deployment manifest
        run: node scripts/verify-manifest.mjs
      # Nothing ships past this job, so the selector gate belongs here too: the
      # manifest can be perfectly coherent and still point at a runtime that is
      # MISSING a function the app sends (r43 and r44 both shipped a gacha
      # router without `playChurn`; every spin reverted with empty data).
      # Reads only; set RPC_URL as a repo secret to use a paid endpoint.
      - name: Verify selector parity against the deployed bytecode
        run: node scripts/verify-selectors.mjs
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
      - name: Type-check the frontend
        run: npm run type-check

  # NOTE: there is deliberately no Railway job here.
  #
  # Railway is now connected directly to this repo (root directory /indexer), so
  # it redeploys the indexer on push by itself. Running `railway up` from CI as
  # well would deploy the same commit twice — two builds racing, and a Ponder
  # resync started while another is mid-flight.
  #
  # The verify job above still gates nothing-ships-broken for the frontend, but
  # be aware Railway's own trigger does NOT wait for it: a bad manifest can reach
  # the indexer even while CI is red. That is the trade for having Railway watch
  # the repo directly, and it is why verify-manifest also runs on prebuild.

  # Vercel builds on push by itself once the repo is linked in its dashboard, so
  # this only reports whether that link is actually live — a silent missing link
  # is the same failure mode as the Railway one.
  frontend:
    needs: [verify, contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Vercel is wired to this repo
        run: |
          echo "Vercel deploys from its own GitHub integration."
          echo "If the site did not update after this push, the repo link is missing:"
          echo "  Vercel > Project > Settings > Git > Connected Git Repository"
